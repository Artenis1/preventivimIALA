name: SmartEstimate checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartestimate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: smartestimate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartestimate -d smartestimate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://smartestimate:ci-only-password@localhost:5432/smartestimate_test
      TEST_POSTGRES_URL: postgresql+psycopg://smartestimate:ci-only-password@localhost:5432/smartestimate_test
      STORAGE_DIR: /tmp/smartestimate-ci-uploads
      COOKIE_SECURE: 'false'
      AI_API_KEY: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install verified Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Test backend and real pgvector integration
        run: python -m pytest -q
      - name: Check migration drift
        run: alembic check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser engineer workflow
        working-directory: .
        run: bash scripts/test-browser.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
