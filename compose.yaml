name: smartestimate
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smartestimate
      POSTGRES_USER: smartestimate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartestimate -d smartestimate"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [private]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://smartestimate:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/smartestimate
      STORAGE_DIR: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      HIGH_CONFIDENCE: ${HIGH_CONFIDENCE:-0.93}
      MEDIUM_CONFIDENCE: ${MEDIUM_CONFIDENCE:-0.65}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    networks: [private, egress]
  frontend:
    build: ./frontend
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [egress]
networks:
  private:
    internal: true
  egress:
volumes:
  postgres_data:
  uploads:
